# enrollment-service — build, test, push to ECR, deploy to EKS
#
# GitHub repository secrets — add under Settings → Secrets and variables → Actions
# (NOT the "Agents" tab; Actions workflows cannot read Agents secrets)
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   MONGO_URI
#   JWT_SECRET
#
# Requires in application/backend/enrollment-service/:
#   Dockerfile
#   k8s/deployment.yml (with **IMAGE**, __MONGO_URI__, and __JWT_SECRET__ placeholders)

name: enrollment-service

on:
  push:
    branches: [main]
    paths:
      - 'application/backend/enrollment-service/**'
      - '.github/workflows/enrollment-service.yml'
  pull_request:
    paths:
      - 'application/backend/enrollment-service/**'
      - '.github/workflows/enrollment-service.yml'
  workflow_dispatch:

env:
  SERVICE_DIR: application/backend/enrollment-service
  ECR_REGISTRY: 909133987673.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE: 909133987673.dkr.ecr.ap-south-1.amazonaws.com/backend/enrollment-service:latest
  ECR_REGION: ap-south-1
  EKS_CLUSTER: cdec-eks-dev
  EKS_REGION: eu-west-1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw clean test -B

  deploy:
    name: Deploy to EKS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          aws ecr describe-images \
            --repository-name backend/enrollment-service \
            --image-ids imageTag="${IMAGE##*:}" \
            --region "${ECR_REGION}"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to EKS
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "${EKS_REGION}" --name "${EKS_CLUSTER}"

          MONGO_URI_ESCAPED=$(printf '%s' "${MONGO_URI}" | sed 's/[&]/\\&/g')
          JWT_SECRET_ESCAPED=$(printf '%s' "${JWT_SECRET}" | sed 's/[&]/\\&/g')
          sed -e "s|__IMAGE__|${IMAGE}|g" \
              -e "s|__MONGO_URI__|${MONGO_URI_ESCAPED}|g" \
              -e "s|__JWT_SECRET__|${JWT_SECRET_ESCAPED}|g" \
              k8s/deployment.yml > k8s/deployment.generated.yml

          echo "Deploying image:"
          grep "image:" k8s/deployment.generated.yml
          kubectl apply -f k8s/deployment.generated.yml -n default
          kubectl get deployment enrollment-service -n default -o yaml | grep image
          kubectl rollout restart deployment/enrollment-service -n default
          if ! kubectl rollout status deployment/enrollment-service -n default --timeout=300s; then
            kubectl describe deployment enrollment-service -n default || true
            kubectl get pods -n default -o wide || true
            kubectl describe pods -n default -l app=enrollment-service || true
            kubectl get events -n default --sort-by=.metadata.creationTimestamp || true
            exit 1
          fi
